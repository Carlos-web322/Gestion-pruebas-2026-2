# Ver tema 22/23 (Parallel Execution) en
# src/test/kotlin/.../writingtests/c22_parallel_execution/
#
# Por defecto la ejecución paralela está DESACTIVADA (igual que el
# comportamiento por defecto de JUnit): las pruebas corren secuencialmente
# en un único hilo. Para experimentar con ejecución paralela, cambia la
# siguiente línea a `true` y vuelve a correr `./gradlew test`. Las pruebas
# de StaticSharedResourcesDemoTest usan @ResourceLock precisamente para
# seguir siendo seguras incluso si activas esto.
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.execution.parallel.mode.default=same_thread
