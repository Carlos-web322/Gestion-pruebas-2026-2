<main>
  <h1>Tareas</h1>

  <form #taskForm="ngForm" (submit)="$event.preventDefault(); addTask(taskForm)">
    <input
      type="text"
      name="title"
      placeholder="Nueva tarea"
      [(ngModel)]="newTitle"
    />
    <button type="submit">Agregar</button>
  </form>

  @if (tasks().length === 0) {
    <p>Sin tareas todavía.</p>
  } @else {
    <ul>
      @for (task of tasks(); track task.id) {
        <li [class.completed]="task.completed">
          @if (editingId() === task.id) {
            <form class="edit-form" (submit)="$event.preventDefault(); saveEdit(task)">
              <input type="text" name="editTitle" [(ngModel)]="editTitle" />
              <button type="submit">Guardar</button>
            </form>
          } @else {
            <input
              type="checkbox"
              [checked]="task.completed"
              (change)="toggleCompleted(task)"
            />
            <span>{{ task.title }}</span>
            <button type="button" class="edit" (click)="startEdit(task)">Editar</button>
            <button type="button" class="delete" (click)="deleteTask(task)">Eliminar</button>
          }
        </li>
      }
    </ul>
  }
</main>
